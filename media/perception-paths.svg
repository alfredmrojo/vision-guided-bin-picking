<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="title desc">
  <title id="title">Two depth paths, one picking scene</title>
  <desc id="desc">The wrist RGB image feeds YOLO marker masks and the MoGe-2 depth model. A fixed correction uses image features and robot geometry. Aligned stereo depth supplies physical motion distances and the reference for comparing both monocular estimates at the planner request.</desc>
  <defs>
    <marker id="estimate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28766c"/>
    </marker>
    <marker id="stereo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3e6698"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="858" height="438" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#152438">
    <text x="28" y="39" font-size="26" font-weight="700">Two depth paths, one picking scene</text>
    <text x="28" y="67" font-size="17" fill="#42556c">Matched at the moment the planner requested a target distance.</text>
    <text x="28" y="108" font-size="16" font-weight="700" fill="#135b54">01 · SINGLE-IMAGE DEPTH</text>
    <text x="271" y="249" font-size="16" font-weight="700" fill="#254b80">02 · MEASURED DEPTH</text>
    <g fill="#e5f5ef" stroke="#afd8cb">
      <rect x="28" y="122" width="205" height="88" rx="10"/>
      <rect x="271" y="122" width="239" height="88" rx="10"/>
      <rect x="555" y="122" width="277" height="88" rx="10"/>
    </g>
    <g fill="#eaf1fa" stroke="#b7cbe4">
      <rect x="28" y="263" width="205" height="88" rx="10"/>
      <rect x="271" y="263" width="239" height="88" rx="10"/>
    </g>
    <rect x="555" y="263" width="277" height="88" rx="10" fill="#fef3d9" stroke="#e1c88e"/>
    <g font-size="18" font-weight="700">
      <text x="44" y="153">Wrist RGB image</text>
      <text x="287" y="153">YOLO masks + MoGe-2</text>
      <text x="571" y="153">Raw + corrected depth</text>
      <text x="44" y="294">Robot motion</text>
      <text x="287" y="294">Aligned D435 depth</text>
      <text x="571" y="294">Compare target depths</text>
    </g>
    <g font-size="15" fill="#42556c">
      <text x="44" y="179">One colour frame</text>
      <text x="287" y="179">Object outlines + raw depth</text>
      <text x="571" y="179">Fixed correction using robot geometry</text>
      <text x="44" y="320">Uses measured distance</text>
      <text x="287" y="320">Stereo reference</text>
      <text x="571" y="320">Both estimates vs. stereo</text>
    </g>
    <g fill="none" stroke="#28766c" stroke-width="2.25" marker-end="url(#estimate-arrow)">
      <path d="M 239 166 H 264"/>
      <path d="M 517 166 H 548"/>
      <path d="M 694 217 V 256"/>
    </g>
    <g fill="none" stroke="#3e6698" stroke-width="2.25" marker-end="url(#stereo-arrow)">
      <path d="M 264 307 H 240"/>
      <path d="M 517 307 H 548"/>
    </g>
    <text x="28" y="411" font-size="16" fill="#42556c">RealSense supplied the reference for training and the distances for physical trials.</text>
  </g>
</svg>
